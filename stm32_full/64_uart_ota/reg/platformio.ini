; 第 64 课：串口 OTA 升级（Bootloader + App）
; 与 63 课相同，一个工程目录两套固件，app 链接到 0x08008000

[env:bootloader]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -D HSE_VALUE=8000000U
build_src_filter = +<bootloader.c>

[env:app]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -D HSE_VALUE=8000000U
  -D APP_START_ADDR=0x08008000UL
build_src_filter = +<app.c>
board_build.ldscript = ld/app.ld
