; 与 reg/ 相同：一个工程目录两套固件，区别只是 HAL 版实现
; 编译：pio run -e bootloader / pio run -e app

[env:bootloader]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -D HSE_VALUE=8000000U
build_src_filter = +<bootloader.c>

[env:app]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -D HSE_VALUE=8000000U
  -D APP_START_ADDR=0x08008000UL
build_src_filter = +<app.c>
board_build.ldscript = ld/app.ld
