; 本课一个工程目录里放两套固件：
;   bootloader：链接到 0x08000000，上电先运行
;   app       ：链接到 0x08008000，由 bootloader 跳转执行
;
; 编译 bootloader：pio run -e bootloader
; 烧录 bootloader：pio run -e bootloader -t upload
; 编译 app       ：pio run -e app
; 烧录 app       ：pio run -e app -t upload

[env:bootloader]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -D HSE_VALUE=8000000U
build_src_filter = +<bootloader.c>
; 限制 Bootloader 不超过 32KB，越界在链接阶段报错
board_build.ldscript = ld/bootloader.ld

[env:app]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
; APP_START 由 app.ld 的 MEMORY 决定，这里只声明给代码用，两处必须一致
build_flags =
  -D HSE_VALUE=8000000U
  -D APP_START_ADDR=0x08008000UL
build_src_filter = +<app.c>
; 默认链接脚本把 Flash 起始定在 0x08000000，
; app 必须改用本目录 ld/app.ld 才能落到 0x08008000
board_build.ldscript = ld/app.ld
